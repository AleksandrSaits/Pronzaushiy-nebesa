<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>МУТАГЕН: АРЕНА</title>
<style>
:root{
  --bg:#070b12; --bg2:#0d1524; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10); --txt:#e9f1fb; --dim:#93a4bd; --accent:#3ddc97; --accent2:#4fb3ff;
  --warn:#ffb020; --bad:#ff5d6c; --good:#3ddc97;
  --r1:#9ca3af; --r2:#38bdf8; --r3:#a78bfa; --r4:#facc15; --r5:#fb923c; --r6:#f87171;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  font-size:15px; line-height:1.45; overflow:hidden; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:-30% -10% auto -10%; height:70vh; z-index:-2; opacity:.5;
  background:radial-gradient(45% 55% at 20% 20%,rgba(61,220,151,.22),transparent 70%),
             radial-gradient(40% 50% at 85% 10%,rgba(79,179,255,.20),transparent 70%),
             radial-gradient(50% 60% at 50% 60%,rgba(167,139,250,.14),transparent 70%);
  animation: drift 18s ease-in-out infinite alternate;
}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(70% 60% at 50% 30%,#000 40%,transparent 100%)}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,-4%,0) scale(1.12)}}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:calc(var(--safe-t) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(7,11,18,.92),rgba(7,11,18,.55));backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:5}
.hud-row{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(145deg,#1c2b44,#0e1726);border:1px solid var(--line);flex:none}
.who{flex:1;min-width:0}
.who > b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who > span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who > span b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.dna{color:#7ef0c0}.chip.rate{color:#ffd479}.chip.lvl{color:#9fd0ff}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3ddc97,#4fb3ff);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.energy i{background:linear-gradient(90deg,#ffb020,#ff7a45)}
.bar.xp i{background:linear-gradient(90deg,#4fb3ff,#a78bfa)}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
nav{display:flex;gap:4px;padding:8px 8px calc(8px + var(--safe-b));background:linear-gradient(0deg,rgba(7,11,18,.96),rgba(7,11,18,.6));backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:11px;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button i{font-style:normal;font-size:19px;filter:grayscale(.7);opacity:.75;transition:.2s}
nav button.on{color:var(--txt);background:var(--card2)}
nav button.on i{filter:none;opacity:1;transform:translateY(-2px) scale(1.06)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}
.card.solid{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035))}
.card h3{margin:0 0 4px;font-size:16px}
.muted{color:var(--dim);font-size:13px}
.tiny{font-size:11.5px;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:700;font-family:inherit;color:#04120c;
  background:linear-gradient(135deg,#3ddc97,#31c2d6);box-shadow:0 8px 22px -10px rgba(61,220,151,.8);transition:.15s}
.btn:active{transform:scale(.975);filter:brightness(1.08)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.blue{background:linear-gradient(135deg,#4fb3ff,#7c6bff);box-shadow:0 8px 22px -10px rgba(79,179,255,.8);color:#04101f}
.btn.red{background:linear-gradient(135deg,#ff6b7a,#ff9a6b);color:#1c0508;box-shadow:0 8px 22px -10px rgba(255,107,122,.7)}
.btn.warm{background:linear-gradient(135deg,#ffb020,#ff7a45);color:#1d1003;box-shadow:0 8px 22px -10px rgba(255,176,32,.7)}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.45;filter:grayscale(.5);pointer-events:none}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-grid.three{grid-template-columns:1fr 1fr 1fr}

.hero{display:flex;gap:12px;align-items:center}
.hero .face{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;font-size:40px;flex:none;position:relative;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.14),rgba(255,255,255,.02));border:1px solid var(--line)}
.hero .face::after{content:"";position:absolute;inset:-6px;border-radius:28px;border:1px solid rgba(61,220,151,.25);opacity:.6;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.06);opacity:.9}}
.cta-title{font-size:18px;font-weight:800;margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;padding:9px 11px}
.stat b{display:block;font-size:16px}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}

.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid transparent}
.tag.r1{color:var(--r1);border-color:color-mix(in srgb,var(--r1) 40%,transparent);background:color-mix(in srgb,var(--r1) 12%,transparent)}
.tag.r2{color:var(--r2);border-color:color-mix(in srgb,var(--r2) 40%,transparent);background:color-mix(in srgb,var(--r2) 12%,transparent)}
.tag.r3{color:var(--rr3,var(--r3));border-color:color-mix(in srgb,var(--r3) 40%,transparent);background:color-mix(in srgb,var(--r3) 12%,transparent)}
.tag.r4{color:var(--r4);border-color:color-mix(in srgb,var(--r4) 40%,transparent);background:color-mix(in srgb,var(--r4) 12%,transparent)}
.tag.r5{color:var(--r5);border-color:color-mix(in srgb,var(--r5) 40%,transparent);background:color-mix(in srgb,var(--r5) 12%,transparent)}
.tag.r6{color:var(--r6);border-color:color-mix(in srgb,var(--r6) 45%,transparent);background:color-mix(in srgb,var(--r6) 14%,transparent)}
.tag.shiny{color:#fff;background:linear-gradient(90deg,#f6d365,#fc913a);border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tag.el{color:var(--dim);border-color:var(--line);background:rgba(255,255,255,.05)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 6px;text-align:center;position:relative;overflow:hidden}
.cell .e{font-size:31px;line-height:1.1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.cell .n{font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{font-size:10px;color:var(--dim)}
.cell.locked{opacity:.35;filter:grayscale(1)}
.cell.shine{border-color:rgba(255,215,101,.55);box-shadow:0 0 18px -4px rgba(255,215,101,.55)}
.cell.shine::after{content:"✨";position:absolute;top:4px;right:5px;font-size:13px}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 12px}
.item .e{font-size:27px;flex:none;width:36px;text-align:center}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:11.5px;color:var(--dim)}
.item .t .bar{margin-top:7px}
.item > .btn{flex:none;width:auto;white-space:nowrap;padding:9px 14px}
.pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line);white-space:nowrap}

.team{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--card);border:1px dashed var(--line);border-radius:15px;padding:10px 4px;text-align:center;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.slot.filled{border-style:solid;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
.slot .e{font-size:29px;line-height:1.1}
.slot .n{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.battle-stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#0b1526,#070b12)}
.fighter-row{display:flex;gap:10px;align-items:center;padding:10px 12px}
.fighter-row .e{font-size:30px;width:40px;text-align:center;flex:none;transition:.2s}
.fighter-row .e.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
.fighter-row .n{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpbar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b7a,#ffa46b);transition:width .4s}
.hpbar.me i{background:linear-gradient(90deg,#3ddc97,#4fb3ff)}
.vs{text-align:center;font-weight:900;font-size:13px;letter-spacing:.2em;color:var(--dim);padding:2px 0}
.log{margin-top:10px;max-height:38vh;overflow-y:auto;font-size:12.5px;line-height:1.55;padding:0 4px}
.log div{opacity:0;animation:slideIn .3s forwards;padding:2px 0}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.log .crit{color:#ffd479}.log .ko{color:#ff8b96;font-weight:700}.log .ability{color:#9fd0ff}.log .venom{color:#c084fc}
.result{padding:14px;text-align:center;border-radius:16px;margin-top:10px;font-weight:800;font-size:19px}
.result.win{background:linear-gradient(135deg,rgba(61,220,151,.22),rgba(79,179,255,.16));border:1px solid rgba(61,220,151,.4)}
.result.lose{background:linear-gradient(135deg,rgba(255,93,108,.2),rgba(255,157,107,.14));border:1px solid rgba(255,93,108,.4)}

.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(3,6,11,.82);backdrop-filter:blur(6px);padding:18px}
.overlay.on{display:flex}
.overlay .sheet{width:100%;max-width:420px;max-height:88vh;overflow-y:auto;background:linear-gradient(160deg,#111c2e,#0a1120);border:1px solid var(--line);border-radius:24px;padding:18px;animation:pop .3s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.loot{display:grid;grid-template-columns:1fr;gap:10px}
.loot5{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loot-card{border-radius:18px;padding:14px;text-align:center;border:1px solid var(--line);background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.10),rgba(255,255,255,.02));animation:cardIn .45s cubic-bezier(.2,1.3,.3,1) backwards}
@keyframes cardIn{from{transform:translateY(22px) scale(.86);opacity:0}to{transform:none;opacity:1}}
.loot-card .e{font-size:56px;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.loot-card .nm{font-weight:800;margin-top:8px}
.loot-card.r4{border-color:rgba(250,204,21,.55);box-shadow:0 0 28px -8px rgba(250,204,21,.7)}
.loot-card.r5{border-color:rgba(251,146,60,.6);box-shadow:0 0 32px -8px rgba(251,146,60,.8)}
.loot-card.r6{border-color:rgba(248,113,113,.65);box-shadow:0 0 36px -6px rgba(248,113,113,.9)}
.loot-card.shine{border-color:rgba(255,215,101,.7);box-shadow:0 0 40px -6px rgba(255,215,101,.95)}
.spinner{width:74px;height:74px;margin:8px auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#4fb3ff);width:0;transition:width .4s}
.meter.fill i{animation:fill 1.4s cubic-bezier(.3,.9,.3,1) forwards}
@keyframes fill{to{width:100%}}

#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 15px;border-radius:14px;background:rgba(12,20,33,.96);border:1px solid var(--line);font-size:13.5px;font-weight:600;box-shadow:0 12px 30px -12px rgba(0,0,0,.9);animation:tin .25s;max-width:86vw;text-align:center}
.toast.err{border-color:rgba(255,93,108,.5);color:#ffd7db}
.toast.ok{border-color:rgba(61,220,151,.5);color:#d3ffee}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.float{position:fixed;z-index:45;font-weight:900;font-size:20px;pointer-events:none;animation:floatUp 1.2s forwards;text-shadow:0 3px 12px rgba(0,0,0,.7)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.loading{opacity:.45;pointer-events:none}
.empty{text-align:center;padding:26px 10px;color:var(--dim)}
.empty .big{font-size:44px;margin-bottom:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mission{border-left:3px solid var(--accent);padding-left:10px}
.mission.done{border-color:var(--warn)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hud-row">
      <div class="avatar" id="hud-avatar">🧬</div>
      <div class="who"><b id="hud-name">Загрузка…</b><span id="hud-sub">подключаемся к лаборатории</span></div>
      <div class="chip dna" id="hud-dna">💎 0</div>
    </div>
    <div class="bar energy"><i id="hud-energy-bar" style="width:0%"></i></div>
  </header>
  <main id="screen"></main>
  <nav id="tabs">
    <button data-act="tab" data-screen="home"><i>🏠</i>Главная</button>
    <button data-act="tab" data-screen="arena"><i>⚔️</i>Арена</button>
    <button data-act="tab" data-screen="mutagen"><i>🧪</i>Мутаген</button>
    <button data-act="tab" data-screen="lab"><i>🧬</i>Лаборатория</button>
    <button data-act="tab" data-screen="profile"><i>👤</i>Профиль</button>
  </nav>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const params = new URLSearchParams(location.search);
const DEV = params.get('dev') === '1';

const S = { data:null, screen:'home', stack:[], busy:false, cfg:{} };
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>Array.from(root.querySelectorAll(s));

function haptic(kind){ try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind||'light'); }catch(e){} }
function notify(kind){ try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(kind||'success'); }catch(e){} }
function back(){ try{ if(tg&&tg.BackButton) tg.BackButton.show(); }catch(e){} }

async function api(path, method, body){
  const headers = {'Content-Type':'application/json'};
  if(tg && tg.initData) headers['Authorization'] = 'tma ' + tg.initData;
  if(DEV){ headers['X-Dev-User'] = localStorage.getItem('dev_uid') || '777000'; headers['X-Dev-Username']='tester'; headers['X-Dev-Name']='Тестер'; }
  const res = await fetch(path, {method:method||'GET', headers, body:body?JSON.stringify(body):undefined});
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok || data.ok === false){
    throw new Error(data.error || ('Ошибка сервера ' + res.status));
  }
  return data;
}

function toast(msg, kind){
  const box = $('#toast');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity='0'; el.style.transform='translateY(10px)'; setTimeout(()=>el.remove(),300); }, 2600);
}

function openSheet(html){ $('#sheet').innerHTML = html; $('#overlay').classList.add('on'); }
function closeSheet(){ $('#overlay').classList.remove('on'); $('#sheet').innerHTML=''; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function rarityTag(r, variant){
  const names = ['','Обычный','Необычный','Редкий','Эпический','Легендарный','Мифический'];
  let h = '<span class="tag r'+r+'">'+names[r]+'</span>';
  if(variant) h += ' <span class="tag shiny">✨</span>';
  return h;
}
function elTag(el){ const m={gen:'🔥 ГЕН',acid:'🧪 КИСЛОТА',crystal:'💎 КРИСТАЛЛ',shade:'🌑 ТЕНЬ',light:'✨ СВЕТ'}; return '<span class="tag el">'+(m[el]||el)+'</span>'; }
function bar(pct, cls){ return '<div class="bar '+(cls||'')+'"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div>'; }
function statBox(label, value){ return '<div class="stat"><b>'+value+'</b><span>'+label+'</span></div>'; }
function pct(a,b){ return b>0 ? Math.round(a/b*100) : 0; }

/* ─────────── Рендер HUD ─────────── */
function renderHud(){
  const u = S.data && S.data.user;
  if(!u) return;
  $('#hud-name').textContent = (u.name||'Игрок') + (u.username?' @'+u.username:'');
  $('#hud-sub').innerHTML = 'Ур. <b>'+u.level+'</b> · 🏅 '+u.rating+' · ⚡ '+u.energy+'/'+u.energy_max;
  $('#hud-dna').textContent = '💎 '+u.dna;
  $('#hud-energy-bar').style.width = pct(u.energy, u.energy_max)+'%';
  const av = $('#hud-avatar');
  av.textContent = (u.name||'🧬').trim().charAt(0).toUpperCase();
}

/* ─────────── Экраны ─────────── */
function screenHome(){
  const d = S.data, u = d.user, team = d.creatures.filter(c=>c.slot>=0);
  const best = team.sort((a,b)=>b.power-a.power)[0] || d.creatures.sort((a,b)=>b.power-a.power)[0];
  const hero = best ? '<div class="hero"><div class="face">'+best.emoji+'</div><div class="grow">'+
      '<div class="cta-title">'+esc(best.title)+'</div>'+
      '<div class="row wrap" style="gap:6px;margin-top:6px">'+rarityTag(best.rarity,best.variant)+elTag(best.element)+'</div>'+
      '<div class="tiny" style="margin-top:6px">⚔️ '+best.atk+' · 🛡️ '+best.def+' · 💨 '+best.spd+' · ❤️ '+best.hp+' · ур. '+best.level+'</div>'+
      '</div></div>' : '';
  const m = d.missions||[];
  const ready = m.filter(x=>x.progress>=x.target && !x.claimed).length;
  return ''+
  '<div class="card solid">'+ (hero || '<div class="empty"><div class="big">🧬</div>Пока нет существ — зайди в мутаген</div>')+
    '<div class="stat-grid">'+

async function doBattle(kind, btn){
  if(S.busy) return; S.busy = true;
  if(btn) btn.classList.add('loading');
  try{
    const res = await api('/api/battle','POST',{kind:kind});
    S.data = res; S.cfg = res.config || S.cfg; render();
    showBattle(res.battle, res.rewards);
  }catch(e){ toast(e.message,'err'); haptic('failed'); }
  finally{ S.busy=false; if(btn) btn.classList.remove('loading'); }
}

function showBattle(b, r){
  const mine = b.my_team||[], opp = b.opp_team||[];
  const html =
    '<div class="battle-stage">'+
      '<div class="fighter-row"><div class="e" id="me-emoji">'+esc((mine[0]||{}).emoji||'🧬')+'</div>'+
        '<div class="grow"><div class="n">'+esc((mine[0]||{}).title||'Ты')+'</div><div class="hpbar me"><i id="me-hp" style="width:100%"></i></div></div></div>'+
      '<div class="vs">VS</div>'+
      '<div class="fighter-row"><div class="e" id="op-emoji">'+esc((opp[0]||{}).emoji||'👾')+'</div>'+
        '<div class="grow"><div class="n">'+esc(b.opp_name||'Соперник')+'</div><div class="hpbar"><i id="op-hp" style="width:100%"></i></div></div></div>'+
      '<div class="log" id="blog"></div>'+
    '</div>'+
    '<div id="bresult"></div>'+
    '<div class="btn-grid" style="margin-top:12px"><button class="btn ghost" data-act="close">Закрыть</button>'+
    '<button class="btn" data-act="tab" data-screen="arena" data-close="1">Ещё бой</button></div>';
  openSheet(html);
  const log = $('#blog');
  const events = b.log||[];
  let i = 0;
  const step = ()=>{
    if(i>=events.length){ finish(); return; }
    const ev = events[i++];
    const line = document.createElement('div');
    line.className = ev.kind;
    line.textContent = ev.text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    if(ev.kind==='hit'||ev.kind==='crit'){
      haptic(ev.kind==='crit'?'medium':'light');
      const e = $('#op-emoji'); if(e){ e.classList.remove('hit'); void e.offsetWidth; e.classList.add('hit'); }
    }
    if(ev.kind==='ko'){ haptic('heavy'); }
    const me = $('#me-hp'), op = $('#op-hp');
    if(me) me.style.width = Math.max(4, 100 - i/events.length*70)+'%';
    if(op) op.style.width = Math.max(4, 100 - i/events.length*95)+'%';
    setTimeout(step, 420);
  };
  const finish = ()=>{
    const win = b.winner==='a';
    const res = document.createElement('div');
    res.className = 'result '+(win?'win':'lose');
    res.innerHTML = win ? '🏆 ПОБЕДА!' : '💀 ПОРАЖЕНИЕ';
    $('#bresult').appendChild(res);
    const rewards = document.createElement('div');
    rewards.className = 'card';
    rewards.style.marginTop = '10px';
    rewards.innerHTML =
      '<div class="row between"><span>💎 ДНК</span><b style="color:var(--good)">+'+(r.dna||0)+'</b></div>'+
      (r.rating_delta? '<div class="row between"><span>🏅 Рейтинг</span><b style="color:'+(r.rating_delta>0?'var(--good)':'var(--bad)')+'">'+(r.rating_delta>0?'+':'')+r.rating_delta+'</b></div>':'')+
      '<div class="row between"><span>🎖 Опыт</span><b>+'+(r.xp||0)+'</b></div>'+
      (r.leveled? '<div class="center" style="margin-top:8px;color:var(--warn);font-weight:800">🎉 НОВЫЙ УРОВЕНЬ: '+(r.level||'')+'</div>':'');
    $('#bresult').appendChild(rewards);
    notify(win?'success':'error');
    if(win) floatText('+'+r.dna+' 💎');
  };
  setTimeout(step, 350);
}

async function doSummon(count, btn){
  if(S.busy) return; S.busy=true;
  if(btn) btn.classList.add('loading');
  openSheet('<div class="center"><div class="spinner"></div><div style="font-weight:700;margin-top:6px">Синтезируем геном…</div>'+
    '<div class="meter fill"><i></i></div><div class="tiny">Сканируем мутацию…</div></div>');
  try{
    const res = await api('/api/summon','POST',{count:count});
    S.data = res; S.cfg = res.config || S.cfg;
    const loot = res.loot||[];
    setTimeout(()=>{
      const cards = loot.map((c,i)=>lootCard(c,i)).join('');
      openSheet('<div class="center" style="margin-bottom:12px"><h3 style="margin:0">'+(count>1?'Открыто '+count+' существ':'Новый мутант!')+'</h3></div>'+
        '<div class="'+(count>1?'loot5':'loot')+'">'+cards+'</div>'+
        '<button class="btn" style="margin-top:14px" data-act="close">Забрать</button>');
      render();
      haptic('medium');
    }, 1400);
  }catch(e){ closeSheet(); toast(e.message,'err'); haptic('failed'); }
  finally{ S.busy=false; if(btn) btn.classList.remove('loading'); }
}

function lootCard(c, i){
  const style = 'animation-delay:'+(i*0.12)+'s';
  return '<div class="loot-card r'+c.rarity+(c.variant?' shine':'')+'" style="'+style+'">'+
    '<div class="e">'+c.emoji+'</div>'+
    '<div class="nm">'+esc(c.title)+'</div>'+
    '<div class="row" style="justify-content:center;gap:5px;margin-top:6px">'+rarityTag(c.rarity,c.variant)+elTag(c.element)+'</div>'+
    '<div class="tiny" style="margin-top:6px">❤️ '+c.hp+' · ⚔️ '+c.atk+' · 🛡️ '+c.def+' · 💨 '+c.spd+'</div>'+
    '<div class="tiny">'+esc(c.ability_label)+'</div>'+
    '<button class="btn sm ghost" style="margin-top:8px" data-act="creature" data-id="'+c.id+'">Открыть</button>'+
  '</div>';
}

/* ─────────── Слияние ─────────── */
async function doMerge(id, btn){
  if(S.busy) return; S.busy=true;
  if(btn) btn.classList.add('loading');
  openSheet('<div class="center"><div class="spinner"></div><div style="font-weight:700;margin-top:6px">Соединяем геномы…</div><div class="meter fill"><i></i></div></div>');
  try{
    const res = await api('/api/merge','POST',{cid:id});
    S.data = res; S.cfg = res.config || S.cfg;
    setTimeout(()=>{
      const c = res.creature;
      if(c){
        openSheet('<div class="center"><div class="tiny" style="margin-bottom:10px">'+(res.message||'Слияние завершено')+'</div>'+lootCard(c,0)+
          '<button class="btn" style="margin-top:14px" data-act="close">Забрать</button></div>');
      } else {
        openSheet('<div class="center"><div style="font-size:44px">⚠️</div><div style="font-weight:700;margin-top:8px">'+esc(res.message||'Не вышло')+'</div>'+
          '<button class="btn ghost" style="margin-top:14px" data-act="close">Закрыть</button></div>');
      }
      render(); haptic('medium');
    }, 1200);
  }catch(e){ closeSheet(); toast(e.message,'err'); }
  finally{ S.busy=false; if(btn) btn.classList.remove('loading'); }
}

function floatText(txt){
  const el = document.createElement('div');
  el.className='float'; el.textContent=txt; el.style.left='50%'; el.style.bottom='120px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}

/* ─────────── Роутинг и рендер ─────────── */
const SCREENS = {home:screenHome, arena:screenArena, mutagen:screenMutagen, lab:screenLab, collection:screenCollection, profile:screenProfile};

function render(){
  if(!S.data) return;
  renderHud();
  const el = $('#screen');
  let html;
  if(S.screen==='dex'){ html = screenDex(S.species); }
  else { const fn = SCREENS[S.screen]||screenHome; html = fn(); }
  el.innerHTML = html;
  $$('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.screen===S.screen || (S.screen==='dex'&&b.dataset.screen==='collection')));
}

async function refresh(){
  const res = await api('/api/state');
  S.data = res; S.cfg = res.config||{};
  render();
}

document.addEventListener('click', async function(e){
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  if(btn.disabled) return;
  haptic();
  try{
    if(act==='tab'){
      if(btn.dataset.close) closeSheet();
      S.stack.push(S.screen); S.screen = btn.dataset.screen; S.species=null; render(); window.scrollTo(0,0);
      if(S.screen==='collection'){ /* данные уже в state */ }
    }
    else if(act==='back'){ S.screen = S.stack.pop()||'home'; render(); }
    else if(act==='close'){ closeSheet(); }
    else if(act==='creature'){ creatureSheet(parseInt(btn.dataset.id,10)); }
    else if(act==='dex'){ S.species = btn.dataset.species; S.screen='dex'; render(); }
    else if(act==='summon'){ await doSummon(parseInt(btn.dataset.count,10), btn); }
    else if(act==='merge'){ await doMerge(parseInt(btn.dataset.id,10), btn); }
    else if(act==='train'){
      const res = await api('/api/train','POST',{cid:parseInt(btn.dataset.id,10), stat:btn.dataset.stat});
      S.data = res; S.cfg = res.config||S.cfg; render(); toast(res.message||'Готово','ok'); closeSheet();
    }
    else if(act==='equip'){
      const res = await api('/api/equip','POST',{cid:parseInt(btn.dataset.id,10), remove: btn.textContent.indexOf('Снять')===0});
      S.data = res; S.cfg = res.config||S.cfg; render(); toast(res.message||'Готово','ok'); closeSheet();
    }
    else if(act==='sell'){
      if(!confirm('Продать существо за ДНК?')) return;
      const res = await api('/api/sell','POST',{cid:parseInt(btn.dataset.id,10)});
      S.data = res; S.cfg = res.config||S.cfg; render(); toast(res.message||'Продано','ok'); closeSheet();
    }
    else if(act==='battle'){ await doBattle(btn.dataset.kind, btn); }
    else if(act==='daily'){
      const res = await api('/api/daily','POST',{});
      S.data = res; S.cfg = res.config||S.cfg; render(); toast(res.message||'Награда получена','ok'); notify('success');
    }
    else if(act==='claim'){
      const res = await api('/api/mission','POST',{key:btn.dataset.key});
      S.data = res; S.cfg = res.config||S.cfg; render(); toast(res.message||'Готово','ok');
    }
    else if(act==='prestige'){
      if(!confirm('Перезапуск генома удалит всю коллекцию. Продолжить?')) return;
      const res = await api('/api/prestige','POST',{});
      S.data = res; S.cfg = res.config||S.cfg; render(); toast(res.message||'Готово','ok');
    }
  }catch(err){ toast(err.message||'Что-то пошло не так','err'); haptic('failed'); }
});

/* ─────────── Старт ─────────── */
(async function init(){
  if(tg){
    try{ tg.ready(); tg.expand(); }catch(e){}
    try{ if(tg.BackButton) tg.BackButton.onClick(()=>{ if($('#overlay').classList.contains('on')) closeSheet(); else if(S.screen!=='home'){ S.screen='home'; S.stack=[]; render(); } else tg.close(); }); }catch(e){}
    if(tg.themeParams && tg.themeParams.accent_color){ document.documentElement.style.setProperty('--accent', tg.themeParams.accent_color); }
  }
  try{
    await refresh();
  }catch(e){
    $('#screen').innerHTML = '<div class="card center"><div style="font-size:42px">📡</div><h3>Нет связи с ботом</h3><div class="tiny">'+esc(e.message||'Ошибка')+'</div>'+
      '<button class="btn sm" style="margin-top:12px" data-act="reload">Повторить</button>'+
      (DEV?'<div class="tiny" style="margin-top:10px">Dev-режим: X-Dev-User='+(localStorage.getItem('dev_uid')||'777000')+'</div>':'')+'</div>';
  }
})();

document.addEventListener('click', function(e){
  const b = e.target.closest('[data-act="reload"]');
  if(b){ refresh().then(render).catch(()=>location.reload()); }
});
})();
</script>
